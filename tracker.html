<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vindictus Scavenger Hunt Tracker</title>
  <style>
    :root {
      --bg: #100905;
      --panel: #21140c;
      --panel-2: #2c1b10;
      --gold: #d8a640;
      --gold-light: #f3d37a;
      --red: #8f1d14;
      --text: #f7ecd7;
      --muted: #c8b28a;
      --border: #70491d;
      --good: #62b36a;
      --bad: #e16b5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at top left, rgba(216,166,64,.18), transparent 34rem),
        radial-gradient(circle at top right, rgba(143,29,20,.18), transparent 35rem),
        linear-gradient(180deg, #1a0e08 0%, #070403 100%);
    }
    .page { width: 100%; padding: 22px; }
    .hero {
      border: 2px solid var(--border);
      background: linear-gradient(135deg, rgba(143,29,20,.35), rgba(33,20,12,.96));
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
      margin-bottom: 18px;
    }
    h1 { margin: 0; color: var(--gold-light); font-size: clamp(2rem, 4vw, 4rem); text-shadow: 0 3px 10px #000; }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 1.15rem; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 14px; margin: 18px 0; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
    .label { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
    .value { color: var(--gold-light); font-size: 1.75rem; font-weight: bold; margin-top: 6px; }
    .controls { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
    button { background: linear-gradient(180deg, var(--gold-light), var(--gold)); border: 1px solid #77531b; color: #211207; font-weight: bold; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-family: inherit; }
    .last { color: var(--muted); }
    .leaderboard { display: grid; gap: 14px; }
    .team { background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.16)), var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 0 12px 35px rgba(0,0,0,.33); }
    .team-header { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; }
    .rank { width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--panel-2); border: 2px solid var(--gold); color: var(--gold-light); font-size: 1.4rem; font-weight: bold; }
    .team-name { color: var(--gold-light); font-size: 1.55rem; font-weight: bold; }
    .players { color: var(--muted); margin-top: 3px; }
    .score { text-align: right; }
    .points { color: var(--gold-light); font-size: 2rem; font-weight: bold; }
    .completed { color: var(--muted); }
    .bar-wrap { margin-top: 14px; height: 14px; background: #0b0604; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .bar { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); width: 0; transition: width .45s ease; }
    .details { margin-top: 12px; display: none; border-top: 1px solid rgba(216,166,64,.28); padding-top: 10px; }
    .team.open .details { display: block; }
    .challenge { display: grid; grid-template-columns: 100px 1fr 90px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .tier, .challenge-points { color: var(--gold-light); font-weight: bold; }
    .empty, .error { background: rgba(0,0,0,.22); border: 1px dashed var(--border); border-radius: 14px; padding: 22px; color: var(--muted); }
    .error { color: #ffd6d0; border-color: var(--bad); white-space: pre-wrap; }
    .hint { font-size: .9rem; color: var(--muted); margin-top: 12px; line-height: 1.45; }
    code { color: var(--gold-light); }
    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .team-header { grid-template-columns: 54px 1fr; }
      .score { grid-column: 1 / -1; text-align: left; }
      .challenge { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Vindictus Scavenger Hunt</h1>
      <div class="subtitle">Nightslayer PvP • Teams of 3 • Live Progress Tracker</div>
    </section>

    <section class="stats">
      <div class="stat"><div class="label">Teams</div><div class="value" id="teamCount">—</div></div>
      <div class="stat"><div class="label">Challenges</div><div class="value" id="challengeCount">—</div></div>
      <div class="stat"><div class="label">Available Points</div><div class="value" id="availablePoints">—</div></div>
      <div class="stat"><div class="label">Leader</div><div class="value" id="leaderName">—</div></div>
    </section>

    <div class="controls">
      <div class="last" id="lastUpdated">Loading tracker...</div>
      <button onclick="loadData()">Refresh Tracker</button>
    </div>

    <section class="leaderboard" id="leaderboard"><div class="empty">Loading team progress...</div></section>
  </main>

  <script>
    const DATA_URL = 'https://script.google.com/macros/s/AKfycbxOJevLhtNOY6iTwDuGYH0MY2oobzodVT4XER1QSYGmafpF0YJr-tYtIG8gF2XhwLb5Dw/exec?action=data';

    async function loadData() {
      const leaderboard = document.getElementById('leaderboard');
      leaderboard.innerHTML = '<div class="empty">Loading team progress...</div>';
      try {
        const url = DATA_URL + '&cacheBust=' + Date.now();
        const response = await fetch(url, { method: 'GET', cache: 'no-store', redirect: 'follow' });
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (jsonError) {
          throw new Error('The Apps Script URL did not return JSON. It returned:\n\n' + text.slice(0, 700));
        }
        if (data.status === 'error') {
          throw new Error('Apps Script backend error:\n' + (data.message || 'Unknown error') + '\n\n' + (data.stack || ''));
        }
        renderTracker(data);
      } catch (error) {
        leaderboard.innerHTML = '<div class="error"><strong>Could not load tracker data.</strong>\n\n' + escapeHtml(error.message) + '\n\nCheck: Apps Script deployment access is “Anyone with the link,” the latest version is deployed, and the URL opens with ?action=data.</div>';
        document.getElementById('lastUpdated').textContent = 'Tracker failed to load.';
        console.error(error);
      }
    }

    function renderTracker(data) {
      const teams = Array.isArray(data.teams) ? data.teams : [];
      document.getElementById('teamCount').textContent = teams.length;
      document.getElementById('challengeCount').textContent = data.totalChallenges ?? '—';
      document.getElementById('availablePoints').textContent = data.totalAvailablePoints ?? '—';
      document.getElementById('leaderName').textContent = teams[0]?.teamName || '—';
      document.getElementById('lastUpdated').textContent = 'Last updated: ' + (data.lastUpdated || new Date().toLocaleString());

      const leaderboard = document.getElementById('leaderboard');
      if (!teams.length) {
        leaderboard.innerHTML = '<div class="empty">No active teams found. Add team names on the Teams tab.</div>';
        return;
      }
      leaderboard.innerHTML = teams.map((team, index) => {
        const totalAvailable = Number(data.totalAvailablePoints) || 1;
        const pct = Math.min(100, Math.round((Number(team.totalPoints || 0) / totalAvailable) * 100));
        const completed = Array.isArray(team.completedChallenges) ? team.completedChallenges : [];
        const completedHtml = completed.length ? completed.map(ch => `
          <div class="challenge">
            <div class="tier">${escapeHtml(ch.tier || '—')}</div>
            <div>${escapeHtml('#' + ch.challengeId + ' — ' + ch.name)}</div>
            <div class="challenge-points">${Number(ch.points || 0)} pts</div>
          </div>
        `).join('') : '<div class="empty">No completed challenges yet.</div>';

        return `
          <article class="team" onclick="this.classList.toggle('open')">
            <div class="team-header">
              <div class="rank">${index + 1}</div>
              <div><div class="team-name">${escapeHtml(team.teamName)}</div><div class="players">${(team.players || []).map(escapeHtml).join(' • ')}</div></div>
              <div class="score"><div class="points">${Number(team.totalPoints || 0)}</div><div class="completed">${Number(team.completedCount || 0)} completed</div></div>
            </div>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
            <div class="details">${completedHtml}<div class="hint">Click the team card to collapse/expand completed challenges.</div></div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
