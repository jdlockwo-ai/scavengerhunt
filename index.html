<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vindictus Scavenger Hunt</title>
  <style>
    :root {
      --bg: #120b07;
      --panel: #24160d;
      --gold: #d8a640;
      --gold-light: #f2d27a;
      --red: #8f1d14;
      --text: #f6ead2;
      --muted: #c8b28a;
      --border: #6e4a1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(216, 166, 64, 0.15), transparent 36%),
        linear-gradient(180deg, #1c0f08 0%, #090604 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    .page { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    .hero {
      text-align: center;
      border: 2px solid var(--border);
      background: linear-gradient(135deg, rgba(143, 29, 20, 0.38), rgba(36, 22, 13, 0.96));
      border-radius: 22px;
      padding: 42px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 { margin: 0; color: var(--gold-light); font-size: clamp(34px, 6vw, 58px); text-shadow: 0 3px 10px #000; }
    .subtitle { color: var(--muted); font-size: 20px; margin: 12px 0 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-top: 28px; }
    .card {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      padding: 22px;
      min-height: 160px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .card h2 { margin: 0 0 10px; color: var(--gold-light); }
    .card p { color: var(--muted); line-height: 1.45; margin: 0; }
    .footer { text-align: center; color: var(--muted); margin-top: 28px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Vindictus Scavenger Hunt</h1>
      <p class="subtitle">Nightslayer PvP • Teams of 3 • Azeroth & Outland</p>
    </section>

    <section class="cards">
      <a class="card" href="clues.html">
        <h2>Challenge List</h2>
        <p>Open the player-facing clue list when the event begins.</p>
      </a>
      <a class="card" href="tracker.html">
        <h2>Live Tracker</h2>
        <p>View team scores, completed challenges, and current standings.</p>
      </a>
    </section>

    <p class="footer">Get your team together and prepare for chaos.</p>
  </main>
</body>
</html>
